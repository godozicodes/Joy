<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Mummy ❤️ - Ozioma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@400;700&display=swap');
    canvas { border-radius: 20px; background: #1f2937; }
  </style>
</head>
<body class="bg-gradient-to-br from-zinc-950 via-purple-950 to-zinc-950 text-white min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <div class="text-center py-12">
      <h1 class="text-6xl font-bold mb-2">My Dearest Mummy</h1>
      <p class="text-5xl text-pink-400">From your Baby Ozioma ❤️</p>
    </div>

    <div class="text-center mb-8">
      <button onclick="toggleMusic()" id="musicBtn" class="bg-pink-600 px-8 py-4 rounded-3xl text-xl font-bold">▶️ Play Love Songs</button>
    </div>

    <h2 class="text-4xl text-center mb-10">🎮 Real Games - Save Your Baby Ozi</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Heart Shooter -->
      <div class="bg-zinc-900 p-6 rounded-3xl">
        <h3 class="text-2xl font-bold mb-4 text-center">🔫 Shoot to Save Ozi</h3>
        <canvas id="shooter" width="320" height="240" class="mx-auto"></canvas>
        <p class="text-center text-sm mt-3">Tap/Click on the moving hearts to shoot kidnappers!</p>
      </div>

      <!-- Endless Runner -->
      <div class="bg-zinc-900 p-6 rounded-3xl">
        <h3 class="text-2xl font-bold mb-4 text-center">🏃 Run & Rescue</h3>
        <canvas id="runner" width="320" height="240" class="mx-auto"></canvas>
        <p class="text-center text-sm mt-3">Tap/Click to jump over obstacles and reach Mummy!</p>
      </div>
    </div>

    <div class="text-center mt-12 text-2xl love">I love you forever, Mummy 💕</div>
  </div>

  <script>
    // Music
    const songs = ["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"];
    let audio = new Audio();
    let isPlaying = false;
    function toggleMusic() {
      if (!isPlaying) {
        audio.src = songs[Math.floor(Math.random()*songs.length)];
        audio.play();
        isPlaying = true;
        document.getElementById('musicBtn').textContent = '⏸️ Pause';
      } else {
        audio.pause();
        isPlaying = false;
        document.getElementById('musicBtn').textContent = '▶️ Play Love Songs';
      }
    }

    // Shooter Game
    const shooterCanvas = document.getElementById('shooter');
    const sCtx = shooterCanvas.getContext('2d');
    let score = 0;
    let targets = [];

    function createTarget() {
      targets.push({x: Math.random()*300, y: Math.random()*180, size: 30, speed: 2 + Math.random()*3});
    }

    function drawShooter() {
      sCtx.clearRect(0,0,320,240);
      sCtx.fillStyle = "#f472b6";
      targets.forEach((t,i) => {
        sCtx.beginPath();
        sCtx.arc(t.x, t.y, t.size/2, 0, Math.PI*2);
        sCtx.fill();
        t.x -= t.speed;
        if (t.x < 0) targets.splice(i,1);
      });
      sCtx.fillStyle = "white";
      sCtx.font = "20px Arial";
      sCtx.fillText(`Score: ${score}`, 10, 30);
      requestAnimationFrame(drawShooter);
    }

    shooterCanvas.addEventListener('click', (e) => {
      const rect = shooterCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      targets = targets.filter(t => {
        const dist = Math.hypot(t.x - clickX, t.y - clickY);
        if (dist < t.size) {
          score++;
          if (score >= 15) alert("🎉 You rescued Baby Ozi! He loves you Mummy ❤️");
          return false;
        }
        return true;
      });
    });

    setInterval(createTarget, 800);
    drawShooter();

    // Runner Game (Simple Jump)
    const runnerCanvas = document.getElementById('runner');
    const rCtx = runnerCanvas.getContext('2d');
    let playerY = 180, velocity = 0, isJumping = false, runnerScore = 0;

    function drawRunner() {
      rCtx.clearRect(0,0,320,240);
      // Ground
      rCtx.fillStyle = "#4b5563";
      rCtx.fillRect(0,200,320,40);
      // Player
      rCtx.fillStyle = "#f472b6";
      rCtx.fillRect(50, playerY, 40, 50);
      // Obstacle
      rCtx.fillStyle = "#ef4444";
      rCtx.fillRect(250, 170, 30, 30);

      runnerScore++;
      rCtx.fillStyle = "white";
      rCtx.fillText(`Distance: ${Math.floor(runnerScore/10)}`, 10, 30);

      if (isJumping) {
        velocity += 0.8;
        playerY += velocity;
        if (playerY >= 180) {
          playerY = 180;
          isJumping = false;
        }
      }
      requestAnimationFrame(drawRunner);
    }

    runnerCanvas.addEventListener('click', () => {
      if (!isJumping) {
        isJumping = true;
        velocity = -15;
      }
    });

    drawRunner();
  </script>
</body>
</html>
